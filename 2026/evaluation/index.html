let key;
async function dec(buf) {
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
}
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = 'Checking…';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
    key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(META.salt), iterations: META.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

    for (const it of items) {
      const li = document.createElement('li'), a = document.createElement('a');
      a.href = '#'; a.textContent = it.label;
      a.onclick = async ev => {
        ev.preventDefault(); a.textContent = it.label + ' (decrypting…)';
        const data = await dec(new Uint8Array(await (await fetch(it.file)).arrayBuffer()));
        const url = URL.createObjectURL(new Blob([data], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
        const d = document.createElement('a'); d.href = url; d.download = it.name; d.click();
        setTimeout(() => URL.revokeObjectURL(url), 5000); a.textContent = it.label;
      };
      li.appendChild(a); ul.appendChild(li);
    }
    document.getElementById('lock').hidden = true; ul.hidden = false;
  } catch (x) { err.textContent = 'Incorrect password.'; }
