const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const st = { get(){ try { return localStorage.getItem(K); } catch(e) { return null; } }, set(v){ try { localStorage.setItem(K, v); } catch(e) {} }, del(){ try { localStorage.removeItem(K); } catch(e) {} } };
async function open(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(P.iv) }, key, b(P.data));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b(P.salt), iterations: P.iter }, base, 256));
}
document.getElementById('eye').onclick = () => { const i = document.getElementById('pw'); const s = i.type === 'password'; i.type = s ? 'text' : 'password'; document.getElementById('eye').textContent = s ? 'HIDE' : 'SHOW'; };
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const go = document.getElementById('go'), err = document.getElementById('err');
  go.disabled = true; err.textContent = ''; go.textContent = 'Checking…';
  try {
    const raw = await derive(document.getElementById('pw').value);
    if (document.getElementById('rem').checked) st.set(btoa(String.fromCharCode(...raw)));
    await open(raw);
  } catch (x) { err.textContent = 'Incorrect password. Please try again.'; go.disabled = false; go.textContent = 'Open generator'; }
};
const saved = st.get();
if (saved) open(b(saved)).catch(() => st.del());
